# Banco de desenvolvimento. Para subir:
#   docker compose up -d
#   cp .env.example .env && npm run db:migrate && npm run db:seed
services:
  db:
    image: postgres:16-alpine
    container_name: odontocrm-db
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - odontocrm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odontocrm-pgdata:
