<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>B3 · Bradesco Saúde Efetivo Plus · referência 16 em Story centralizado</title>
<link rel="stylesheet" href="base.css">
<style>
  /* B3 — referência 16 medida por medida, nas cores do logo da Bradesco Saúde (vermelho-escuro e vermelho no lugar do
     preto e dourado): fachada real do Samaritano no alto, aba branca com o logo, título "Seu plano de saúde com o
     Samaritano na rede", cartão com "3 VIDAS A PARTIR DE" e o preço, caixa vermelha "SEM COPARTICIPAÇÃO", os outros
     hospitais da rede em enfermaria separados por barras e faixa vermelha de CTA. */
  body { background: #2b0009; color: #fff; }
  .sq { --fh: 500px; --pos: 60% 40%; }
  .foto-topo .veu { background: linear-gradient(180deg, rgba(43,0,9,0) 0%, rgba(43,0,9,0) 72%, rgba(43,0,9,.82) 88%, #2b0009 100%); }
  .credito.f { left: 18px; top: 18px; }
  .aba-logo { right: 0; top: 0; width: 250px; height: 112px; border-radius: 0 0 0 24px; background: #fff; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .aba-logo .logo { width: 170px; color: #cc092f; }

  .tit { left: 0; right: 0; top: 404px; text-align: center; font-weight: 700; font-size: 48px; line-height: 1.18; }
  .tit b { color: #ff8a9e; }

  .card { left: 84px; top: 556px; width: 610px; height: 186px; border-radius: 36px 92px 36px 36px; background: #5a0016; z-index: 2;
    box-shadow: 0 16px 36px rgba(0,0,0,.35); }
  .card .aba-cnpj { position: absolute; left: 40px; top: -22px; background: #fff; color: #a1001f; }
  .card .aba-cnpj .icone { color: #cc092f; }
  .card .rot { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-weight: 600; font-size: 33px; text-transform: uppercase;
    color: #ff9bad; }
  .card .preco { position: absolute; left: 0; right: 0; top: 86px; text-align: center; font-size: 74px; }
  .laranja { left: 640px; top: 578px; width: 356px; height: 143px; border-radius: 0 22px 22px 0; z-index: 1;
    background: linear-gradient(100deg, #a8062a 0%, #cc092f 55%, #b8062a 100%); display: flex; flex-direction: column; justify-content: center;
    padding-left: 74px; font-weight: 700; font-size: 28px; line-height: 1.15; text-transform: uppercase; }
  .nota-preco { left: 0; right: 0; top: 754px; text-align: center; color: #f3d3d9; }

  .bex { left: 0; right: 0; top: 798px; text-align: center; font-weight: 700; font-size: 27px; text-transform: uppercase; }
  .lista { left: 70px; right: 70px; top: 838px; text-align: center; font-weight: 500; font-size: 22px; line-height: 1.38; text-transform: uppercase; }
  .lista span { white-space: nowrap; }
  .lista i { font-style: normal; color: #ff5470; padding: 0 4px; }

  .nota { color: rgba(255,255,255,.78); font-style: italic; }
  .faixa { background: linear-gradient(90deg, #b8062a 0%, #cc092f 50%, #b8062a 100%); }
  .faixa .txt { color: #fff; text-transform: uppercase; font-size: 29px; }
</style>
</head>
<body data-operadora="bradesco">
  <div class="sq">
    <div class="foto-topo"><img src="../assets/fotos/samaritano-hsama.jpg" alt=""><div class="veu"></div></div>
    <p class="credito f">Foto: Hsama · CC BY 3.0</p>
    <div class="aba-logo"><div class="logo" data-marca="bradesco"></div></div>

    <p class="tit">Seu plano de saúde<br>com o <b>Samaritano</b> na rede</p>

    <div class="card">
      <p class="aba-cnpj"><span data-icone="maleta"></span>Exclusivo para CNPJ/MEI</p>
      <p class="rot">3 vidas a partir de</p>
      <p class="preco"><span class="rs">R$</span>2.362,01<span class="cent">*</span></p>
    </div>
    <p class="laranja">Sem<br>coparticipação</p>
    <p class="nota-preco"></p>

    <p class="bex">Também na rede, em enfermaria</p>
    <p class="lista"><span>BP – Beneficência Portuguesa</span> <i>|</i> <span>InCor</span> <i>|</i> <span>São Camilo Ipiranga</span> <i>|</i> <span>São Camilo Santana</span></p>

    <p class="nota"></p>
    <div class="faixa"><p class="txt">Solicite sua cotação online<span data-icone="seta"></span></p></div>
  </div>

  <script type="module">
    import { montar } from './base.js';
    await montar();
  </script>
</body>
</html>
