<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>S1 · SulAmérica Direto Nacional · referência 10 em Story centralizado</title>
<link rel="stylesheet" href="base.css">
<style>
  /* S1 — referência 10 medida por medida: fachada real da BP (com o logo) em cima, degradê para o azul-marinho da
     SulAmérica, chamada em caixa alta, tarja laranja "PLANOS DE SAÚDE", texto de 3 linhas à esquerda, cartão branco com
     aba laranja "EXCLUSIVO PARA CNPJ/MEI", "3 VIDAS por apenas" e o preço, fila de hospitais da rede em branco e faixa
     laranja em degradê com a aba branca do logo. Cores: #0b2354 e #e16025→#f1743a (amostradas da ref 10). */
  body { background: #0b2354; color: #fff; }
  .sq { --fh: 470px; --pos: 46% 50%; }
  .foto-topo .veu { background: linear-gradient(180deg, rgba(11,35,84,0) 0%, rgba(11,35,84,0) 76%, rgba(11,35,84,.86) 89%, #0b2354 100%); }
  .credito.f { right: 18px; top: 18px; }

  .chamada { left: 0; right: 0; top: 396px; text-align: center; font-weight: 500; font-size: 29px; letter-spacing: .01em; text-transform: uppercase; }
  .ps { left: 50%; top: 448px; transform: translateX(-50%); height: 84px; padding: 0 26px; display: flex; align-items: center; background: #ef6a2c;
    color: #0b2354; font-weight: 700; font-size: 66px; line-height: 1; letter-spacing: .005em; text-transform: uppercase; white-space: nowrap;
    box-shadow: 0 0 0 3px rgba(255,255,255,.18); }

  .esq { left: 96px; top: 640px; width: 420px; font-weight: 400; font-size: 31px; line-height: 1.18; }
  .esq b { font-weight: 700; }

  .card { left: 520px; top: 610px; width: 440px; height: 200px; border-radius: 24px; background: #fff; color: #0b2354;
    box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .card .aba-cnpj { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); background: #e7662b; color: #fff; }
  .card .l1 { position: absolute; left: 0; right: 0; top: 38px; text-align: center; font-weight: 400; font-size: 31px; line-height: 1; }
  .card .l1 b { font-weight: 700; color: #e7662b; }
  .card .preco { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 70px; }
  .card .nota-preco { position: absolute; left: 0; right: 0; top: 162px; text-align: center; color: #4b5578; }

  .marcas { left: 0; right: 0; top: 828px; color: #fff; }

  .nota { color: rgba(255,255,255,.82); }
  .faixa { background: linear-gradient(90deg, #d9561d 0%, #e46a2a 60%, #ee7a3a 100%); }
  .faixa .txt { justify-content: flex-start; padding-left: 56px; color: #fff; text-transform: uppercase; }
  .aba-logo { right: 0; top: calc(var(--h) - 92px); width: 250px; height: 92px; border-radius: 22px 0 0 0; background: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: -6px -6px 18px rgba(0,0,0,.12); }
  .aba-logo .logo { width: 190px; }
</style>
</head>
<body data-operadora="sula">
  <div class="sq">
    <div class="foto-topo"><img src="../assets/fotos/bp-melozi.jpg" alt=""><div class="veu"></div></div>
    <p class="credito f">Foto: Cecilia Melozi · CC BY-SA 4.0</p>

    <p class="chamada">Sua empresa protegida com SulAmérica</p>
    <p class="ps">Planos de Saúde</p>

    <p class="esq">Tenha um plano <b>sem coparticipação</b> e acesso à <b>BP</b> e ao <b>São Luiz</b>.</p>

    <div class="card">
      <p class="aba-cnpj"><span data-icone="maleta"></span>Exclusivo para CNPJ/MEI</p>
      <p class="l1"><b>3 VIDAS</b> por apenas</p>
      <p class="preco"><span class="rs">R$</span>1.593,54<span class="cent">*</span></p>
      <p class="nota-preco"></p>
    </div>

    <div class="marcas">
      <p class="marca-h"><b>BP</b><span>Beneficência Portuguesa</span></p><i></i>
      <p class="marca-h"><b>São Luiz</b><span>Jabaquara</span></p>
    </div>

    <p class="nota"></p>
    <div class="faixa"><p class="txt">Solicite sua cotação<span data-icone="seta"></span></p></div>
    <div class="aba-logo"><div class="logo" data-marca="sula"></div></div>
  </div>

  <script type="module">
    import { montar } from './base.js';
    await montar();
  </script>
</body>
</html>
