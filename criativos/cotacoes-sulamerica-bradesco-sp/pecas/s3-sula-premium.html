<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>S3 · SulAmérica Direto Nacional · referência 16 em Story centralizado</title>
<link rel="stylesheet" href="base.css">
<style>
  /* S3 — referência 16 medida por medida, nas cores do logo da SulAmérica (azul-marinho e laranja no lugar do preto e
     dourado): fachada real da BP no alto, aba branca com o logo, título branco "Seu plano de saúde com a BP na rede",
     cartão azul com "3 VIDAS A PARTIR DE" e o preço, caixa laranja "SEM COPARTICIPAÇÃO", benefícios separados por barras
     laranja e faixa laranja de CTA. */
  body { background: #061632; color: #fff; }
  .sq { --fh: 500px; --fw: 2600px; --fhi: 1169px; --fl: -560px; --ft: 0px; }
  .foto-topo .veu { background: linear-gradient(180deg, rgba(6,22,50,0) 0%, rgba(6,22,50,0) 72%, rgba(6,22,50,.8) 88%, #061632 100%); }
  .credito.f { left: 18px; top: 18px; }
  .aba-logo { right: 0; top: 0; width: 250px; height: 112px; border-radius: 0 0 0 24px; background: #fff; display: flex; align-items: center;
    justify-content: center; box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  .aba-logo .logo { width: 190px; }

  .tit { left: 0; right: 0; top: 404px; text-align: center; font-weight: 700; font-size: 48px; line-height: 1.18; }
  .tit b { color: #f1743a; }

  .card { left: 84px; top: 556px; width: 610px; height: 186px; border-radius: 36px 92px 36px 36px; background: #15346e; z-index: 2;
    box-shadow: 0 16px 36px rgba(0,0,0,.35); }
  .card .aba-cnpj { position: absolute; left: 40px; top: -22px; background: #fff; color: #0b2354; }
  .card .aba-cnpj .icone { color: #df5e23; }
  .card .rot { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-weight: 600; font-size: 33px; text-transform: uppercase;
    color: #f5935e; }
  .card .preco { position: absolute; left: 0; right: 0; top: 86px; text-align: center; font-size: 74px; }
  .laranja { left: 640px; top: 578px; width: 356px; height: 143px; border-radius: 0 22px 22px 0; z-index: 1;
    background: linear-gradient(100deg, #c94a17 0%, #df5e23 55%, #d4551c 100%); display: flex; flex-direction: column; justify-content: center;
    padding-left: 74px; font-weight: 700; font-size: 28px; line-height: 1.15; text-transform: uppercase; }
  .nota-preco { left: 0; right: 0; top: 754px; text-align: center; color: #c9d0ea; }

  .bex { left: 0; right: 0; top: 798px; text-align: center; font-weight: 700; font-size: 27px; text-transform: uppercase; }
  .lista { left: 70px; right: 70px; top: 838px; text-align: center; font-weight: 500; font-size: 22px; line-height: 1.38; text-transform: uppercase; }
  .lista span { white-space: nowrap; }
  .lista i { font-style: normal; color: #f1743a; padding: 0 4px; }

  .nota { color: rgba(255,255,255,.78); font-style: italic; }
  .faixa { background: linear-gradient(90deg, #cf4f19 0%, #df5e23 50%, #d4551c 100%); }
  .faixa .txt { color: #fff; text-transform: uppercase; font-size: 29px; }
</style>
</head>
<body data-operadora="sula">
  <div class="sq">
    <div class="foto-topo"><img src="../assets/fotos/bp-possi-a.jpg" alt=""><div class="veu"></div></div>
    <p class="credito f">Foto: Alexandre Possi · CC BY 3.0</p>
    <div class="aba-logo"><div class="logo" data-marca="sula"></div></div>

    <p class="tit">Seu plano de saúde<br>com a <b>BP</b> na rede</p>

    <div class="card">
      <p class="aba-cnpj"><span data-icone="maleta"></span>Exclusivo para CNPJ/MEI</p>
      <p class="rot">3 vidas a partir de</p>
      <p class="preco"><span class="rs">R$</span>1.593,54<span class="cent">*</span></p>
    </div>
    <p class="laranja">Sem<br>coparticipação</p>
    <p class="nota-preco"></p>

    <p class="bex">Benefícios do plano</p>
    <p class="lista"><span>Enfermaria</span> <i>|</i> <span>Abrangência nacional</span> <i>|</i> <span>Pronto-socorro na BP</span> <i>|</i> <span>São Luiz Jabaquara na rede</span></p>

    <p class="nota"></p>
    <div class="faixa"><p class="txt">Solicite sua cotação online<span data-icone="seta"></span></p></div>
  </div>

  <script type="module">
    import { montar } from './base.js';
    await montar();
  </script>
</body>
</html>
