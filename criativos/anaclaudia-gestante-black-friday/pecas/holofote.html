<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Layout holofote</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Modelo da página do holofote do PDF: fundo quase preto e círculo de luz atrás da modelo.
     A modelo entra recortada (ferramentas/recortar.py) e o círculo é desenhado aqui.
     O grão fica só no fundo e no círculo (sem faixas no degradê); a modelo fica limpa por cima. */
  body { background: linear-gradient(to bottom, #222 0%, #242424 62%, #2c2c2c 100%); }
  .luz { position: absolute; border-radius: 50%;
    background: radial-gradient(circle closest-side at 50% 46%, #fff 0%, #f7f7f7 55%, #ededed 86%, rgba(237,237,237,.75) 95%, rgba(237,237,237,0) 100%); }
  .chao { position: absolute; background: radial-gradient(closest-side, rgba(0,0,0,.62), rgba(0,0,0,0)); }
  .modelo { position: absolute; display: block; filter: drop-shadow(16px 14px 26px rgba(0,0,0,.38)); }
  .bloco { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .bloco .espacado { color: #d9d4cc; padding-left: .42em; }
  .titulo { font-family: var(--display); font-weight: 400; line-height: 1.06; color: var(--marfim); }
  .caixa .rotulo { width: 54%; }
  .caixa .valor { width: 46%; }
  .nota { color: #d6d1c9; font-weight: 500; }

  /* STORY 1080x1920 — texto entre y=270 e y=980 (dentro da zona segura 250–1530) */
  .story .etiqueta { --w: 160px; --circ: 272px; right: 34px; }
  .story .bloco { top: 410px; }
  .story .bloco .espacado { font-size: 36px; }
  .story .titulo { font-size: 84px; margin-top: 18px; }
  .story .caixas { display: flex; flex-direction: column; gap: 18px; margin-top: 36px; }
  .story .caixa { width: 860px; height: 116px; }
  .story .caixa .rotulo { font-size: 26px; }
  .story .caixa .pct { font-size: 86px; }
  .story .caixa .off { font-size: 30px; }
  .story .nota { font-size: 21px; margin-top: 18px; }

  /* FEED 4:5 1080x1350 */
  .feed .etiqueta { --w: 124px; --circ: 46px; right: 34px; }
  .feed .bloco { top: 90px; }
  .feed .bloco .espacado { font-size: 30px; }
  .feed .titulo { font-size: 66px; margin-top: 14px; }
  .feed .caixas { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
  .feed .caixa { width: 760px; height: 96px; }
  .feed .caixa .rotulo { font-size: 22px; }
  .feed .caixa .pct { font-size: 72px; }
  .feed .caixa .off { font-size: 26px; }
  .feed .nota { font-size: 17px; margin-top: 14px; }
</style>
</head>
<body>
  <div class="luz"></div>
  <div class="grao"></div>
  <div class="chao"></div>
  <img class="modelo" alt="">
  <div class="etiqueta"><img src="../assets/marca/etiqueta-black-friday.png" alt="Black Friday"></div>
  <section class="bloco">
    <p class="espacado">Black Friday</p>
    <h1 class="titulo">Condição Especial<br>somente em Novembro</h1>
    <div class="caixas">
      <div class="caixa"><div class="rotulo">Ensaio Gestante*</div>
        <div class="valor"><span class="pv"><span class="pct">15%</span><span class="off">OFF</span></span></div></div>
      <div class="caixa"><div class="rotulo">Combo Gestante<br>+ Newborn*</div>
        <div class="valor"><span class="pv"><span class="pct">20%</span><span class="off">OFF</span></span></div></div>
    </div>
    <p class="nota"></p>
  </section>

  <script type="module">
    import { peca, posiciona, pronto, NOTA } from './base.js';
    const { p, fmt, recorte } = peca();
    const img = document.querySelector('.modelo');
    img.src = recorte; posiciona(img, p.quadro[fmt]);
    const l = p.luz[fmt];
    Object.assign(document.querySelector('.luz').style, { width: `${l.d}px`, height: `${l.d}px`, left: `${l.cx - l.d / 2}px`, top: `${l.cy - l.d / 2}px` });
    const chao = document.querySelector('.chao'), s = p.sombra?.[fmt];
    if (s) Object.assign(chao.style, { width: `${s.w}px`, height: `${s.h}px`, left: `${s.cx - s.w / 2}px`, top: `${s.cy - s.h / 2}px` });
    else chao.remove();
    document.querySelector('.nota').textContent = NOTA;
    pronto();
  </script>
</body>
</html>
