<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Layout editorial (papel)</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Papel + fotos impressas (referência: promo Combo Gestante + Newborn de setembro): fundo de papel,
     "Ensaio de ..." em serifa escura, linhas finas, desconto grande e as fotos como impressos com borda branca.
     Nas peças com as duas fotos, cada impresso leva na borda de baixo o desconto daquela foto.
     Feed: lado (texto à esquerda, foto à direita) · foto-topo (foto em cima, texto embaixo) · texto-topo. */
  body { background: #f3f0ea url('../assets/marca/papel.jpg') repeat; background-size: 384px 384px; color: var(--tinta); }
  .texto { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .texto .espacado { color: var(--vinho); }
  .ensaio { font-family: var(--display); color: #4a453d; }
  .titulo { color: var(--tinta); }
  .linhas { border-top: 1.5px solid #2b2925; border-bottom: 1.5px solid #2b2925; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: #2b2925; width: 100%; }
  .of { display: flex; flex-direction: column; align-items: center; }
  .of .pct-linha { color: var(--tinta); }
  .of .rot { font-weight: 600; text-transform: uppercase; letter-spacing: .12em; line-height: 1.3; color: #2b2925; }
  .nota { color: #3e3a34; }

  /* STORY 1080x1920 — texto entre y=250 e y=1530 */
  .story .etiqueta { --w: 150px; --circ: 268px; right: 34px; }
  .story .texto { left: 120px; right: 120px; top: 268px; }
  .story .texto .espacado { font-size: 32px; }
  .story .ensaio { font-size: 46px; margin-top: 18px; }
  .story .wordmark { width: 540px; margin-top: 8px; }
  .story .titulo { font-size: 92px; margin-top: 0; }
  .story.grupo-juntos .titulo { font-size: 74px; }
  .story.grupo-juntos .of .pct { font-size: 132px; }
  .story.grupo-juntos .of .off { font-size: 40px; }
  .story .linhas { font-size: 24px; padding: 16px 0; margin-top: 26px; }
  .story .of { margin-top: 20px; }
  .story .of .pct { font-size: 150px; }
  .story .of .off { font-size: 44px; }
  .story .of .rot { font-size: 23px; margin-top: 6px; }
  .story .nota { font-size: 21px; margin-top: 14px; }
  .story.grupo-juntos .nota { margin-top: 16px; }

  /* FEED 4:5 1080x1350 */
  .feed .etiqueta { --w: 112px; --circ: 40px; right: 30px; }
  .feed .texto .espacado { font-size: 26px; }
  .feed .ensaio { font-size: 38px; margin-top: 12px; }
  .feed .wordmark { width: 430px; margin-top: 6px; }
  .feed .titulo { font-size: 72px; }
  .feed .linhas { font-size: 19px; padding: 13px 0; margin-top: 22px; }
  .feed .of { margin-top: 16px; }
  .feed .of .pct { font-size: 124px; }
  .feed .of .off { font-size: 37px; }
  .feed .of .rot { font-size: 19px; margin-top: 4px; }
  .feed .nota { font-size: 17px; margin-top: 12px; }
  .feed.lado .etiqueta { left: 40px; right: auto; }
  .feed.lado .texto { left: 60px; width: 470px; top: 340px; }
  .feed.foto-topo .texto { left: 150px; right: 150px; top: 690px; }
  .feed.foto-topo .ensaio { display: none; }
  .feed.texto-topo .texto { left: 150px; right: 150px; top: 48px; }
  .feed.texto-topo .titulo { font-size: 58px; }
  .feed.texto-topo .of .pct { font-size: 104px; }
  .feed.texto-topo .of .off { font-size: 32px; }
  .feed.texto-topo .ensaio { font-size: 30px; margin-top: 6px; }
</style>
</head>
<body>
  <div class="etiqueta"><img src="../assets/marca/etiqueta-black-friday.png" alt="Black Friday"></div>
  <section class="texto"></section>

  <script type="module">
    import { peca, montarQuadros, pronto, OFERTAS, pctHTML, CONDICAO, NOTA } from './base.js';
    const { p, fmt } = peca();
    const umaLinha = fmt === 'feed' && p.variante !== 'lado';
    const titulo = {
      gestante: '<p class="ensaio">Ensaio de</p><img class="wordmark" src="../assets/marca/gestante-wordmark-escuro.png" alt="Gestante">',
      newborn: umaLinha ? '<h1 class="titulo">Ensaio de Newborn</h1>' : '<p class="ensaio">Ensaio de</p><h1 class="titulo">Newborn</h1>',
      juntos: '<p class="ensaio">Combo</p><h1 class="titulo">Gestante + Newborn</h1>',
    }[p.grupo];
    // combo (duas fotos): uma oferta só, 20%; cada impresso leva na legenda o nome do seu ensaio
    const o = OFERTAS[p.grupo === 'juntos' ? 'combo' : p.grupo];
    const oferta = `<div class="of">${pctHTML(o)}<p class="rot">${o.rotulo}</p></div>`;
    document.querySelector('.texto').innerHTML = `
      <p class="espacado">Black Friday</p>${titulo}
      <p class="linhas">${CONDICAO}</p>${oferta}
      <p class="nota">${NOTA}</p>`;
    await montarQuadros(p.quadros[fmt]);
    pronto();
  </script>
</body>
</html>
