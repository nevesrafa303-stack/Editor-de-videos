<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Layout convite</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Convite (última página do PDF, "Vamos fazer o seu ensaio?"): foto(s) em card à esquerda,
     painel claro à direita com texto centralizado, pílulas pretas com o desconto grande embaixo. */
  body { background: var(--papel); color: var(--preto); }
  .painel { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .painel .espacado { color: var(--vinho); letter-spacing: .3em; padding-left: .3em; }
  .titulo { color: var(--preto); }
  .linha { width: 70%; height: 1px; background: #cfcfcf; }
  .pct-linha { color: var(--preto); }
  .nota { color: #3d3d3d; }

  /* STORY 1080x1920 — texto entre y=250 e y=1530 */
  .story .etiqueta { --w: 150px; --circ: 272px; right: 36px; }
  .story .painel { left: 560px; right: 36px; top: 540px; }
  .story.grupo-juntos .painel { top: 470px; }
  .story .painel .espacado { font-size: 32px; }
  .story .titulo { font-size: 78px; margin-top: 14px; }
  .story .linha { margin: 34px 0 32px; }
  .story .pilula-preta { font-size: 20px; padding: 13px 22px; }
  .story .pct { font-size: 132px; }
  .story .off { font-size: 38px; }
  .story .pct-linha { margin: 6px 0 28px; }
  .story.grupo-juntos .pct { font-size: 112px; }
  .story.grupo-juntos .pct-linha { margin: 4px 0 22px; }
  .story .nota { font-size: 21px; margin-top: 4px; }

  /* FEED 4:5 1080x1350 */
  .feed .etiqueta { --w: 116px; --circ: 40px; right: 30px; }
  .feed .painel { left: 535px; right: 30px; top: 370px; }
  .feed.grupo-juntos .painel { top: 300px; }
  .feed .painel .espacado { font-size: 28px; }
  .feed .titulo { font-size: 66px; margin-top: 12px; }
  .feed .linha { margin: 28px 0 26px; }
  .feed .pilula-preta { font-size: 18px; padding: 12px 20px; }
  .feed .pct { font-size: 116px; }
  .feed .off { font-size: 34px; }
  .feed .pct-linha { margin: 4px 0 24px; }
  .feed.grupo-juntos .pct { font-size: 96px; }
  .feed.grupo-juntos .pct-linha { margin: 2px 0 18px; }
  .feed .nota { font-size: 18px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="etiqueta"><img src="../assets/marca/etiqueta-black-friday.png" alt="Black Friday"></div>
  <section class="painel"></section>

  <script type="module">
    import { peca, montarQuadros, pronto, ofertasDo, NOTA } from './base.js';
    const { p, fmt } = peca();
    document.querySelector('.painel').innerHTML = `
      <p class="espacado">Black Friday</p>
      <h1 class="titulo">Condição<br>Especial<br>somente em<br>Novembro</h1>
      <div class="linha"></div>
      ${ofertasDo(p.grupo).map(o => `<span class="pilula-preta">${o.rotulo}</span>
        <div class="pct-linha"><span class="pct">${o.pct}</span><span class="off">OFF</span></div>`).join('')}
      <p class="nota">${NOTA.replace('reservas realizadas', 'reservas realizadas<br>')}</p>`;
    await montarQuadros(p.quadros[fmt]);
    pronto();
  </script>
</body>
</html>
