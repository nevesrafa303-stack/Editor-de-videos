<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Layout convite</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Convite (última página do PDF): papel claro, título no alto e foto(s) em card à esquerda com o desconto
     à direita de cada foto (gestante → 15%, newborn → 20%). */
  body { background: var(--papel); color: var(--preto); }
  .topo { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .topo .espacado { color: var(--vinho); letter-spacing: .3em; padding-left: .3em; }
  .titulo { color: var(--preto); }
  .oferta { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .oferta .ensaio { font-family: var(--display); color: #2a2825; line-height: 1.05; }
  .linha { width: 60%; height: 1px; background: #cfcfcf; }
  .pct-linha { color: var(--preto); }
  .nota { position: absolute; color: #3d3d3d; text-align: center; }

  /* STORY 1080x1920 — texto entre y=250 e y=1530 */
  .story .etiqueta { --w: 150px; --circ: 272px; right: 36px; }
  .story .topo { top: 270px; }
  .story .topo .espacado { font-size: 32px; }
  .story .titulo { font-size: 66px; margin-top: 10px; }
  .story .oferta { left: 570px; right: 40px; }
  .story .oferta .ensaio { font-size: 70px; }
  .story .linha { margin: 24px 0 22px; }
  .story .pilula-preta { font-size: 20px; padding: 13px 22px; }
  .story .pct { font-size: 150px; }
  .story .off { font-size: 44px; }
  .story .pct-linha { margin-top: 8px; }
  .story .nota { font-size: 21px; left: 570px; right: 40px; }
  .story.fotos-1 .oferta { top: 660px; }
  .story.fotos-1 .nota { top: 1150px; }
  .story.fotos-2 .oferta.o1 { top: 700px; }
  .story.fotos-2 .oferta .ensaio { font-size: 66px; }
  .story.fotos-2 .nota { top: 1250px; }

  /* FEED 4:5 1080x1350 */
  .feed .etiqueta { --w: 116px; --circ: 40px; right: 30px; }
  .feed .topo { top: 46px; }
  .feed .topo .espacado { font-size: 27px; }
  .feed .titulo { font-size: 48px; margin-top: 6px; line-height: 1.04; }
  .feed .oferta { left: 560px; right: 40px; }
  .feed .oferta .ensaio { font-size: 60px; }
  .feed .linha { margin: 20px 0 18px; }
  .feed .pilula-preta { font-size: 18px; padding: 12px 20px; }
  .feed .pct { font-size: 132px; }
  .feed .off { font-size: 39px; }
  .feed .pct-linha { margin-top: 6px; }
  .feed .nota { font-size: 17px; left: 560px; right: 40px; }
  .feed.fotos-1 .oferta { top: 420px; }
  .feed.fotos-1 .nota { top: 850px; }
  .feed.fotos-2 .oferta.o1 { top: 440px; }
  .feed.fotos-2 .oferta .ensaio { font-size: 54px; }
  .feed.fotos-2 .nota { top: 930px; }
</style>
</head>
<body>
  <div class="etiqueta"><img src="../assets/marca/etiqueta-black-friday.png" alt="Black Friday"></div>
  <header class="topo"></header>
  <p class="nota"></p>

  <script type="module">
    import { peca, montarQuadros, pronto, OFERTAS, pctHTML, NOTA } from './base.js';
    const { p, fmt } = peca();
    document.querySelector('.topo').innerHTML = `<p class="espacado">Black Friday</p>
      <h1 class="titulo">Condição Especial<br>somente em Novembro</h1>`;
    // combo (duas fotos): uma oferta só, 20%, ao lado das duas fotos
    const o = OFERTAS[p.grupo === 'juntos' ? 'combo' : p.grupo];
    const nome = { gestante: 'Ensaio de<br>Gestante*', newborn: 'Ensaio de<br>Newborn*', juntos: 'Combo<br>Gestante<br>+ Newborn*' }[p.grupo];
    const el = document.createElement('section');
    el.className = 'oferta o1';
    el.innerHTML = `<p class="ensaio">${nome}</p><div class="linha"></div>${pctHTML(o)}`;
    document.body.appendChild(el);
    document.querySelector('.nota').innerHTML = NOTA.replace('reservas realizadas', 'reservas realizadas<br>');
    await montarQuadros(p.quadros[fmt]);
    pronto();
  </script>
</body>
</html>
