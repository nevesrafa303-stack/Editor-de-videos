<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Layout convite</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Modelo da última página do PDF ("Vamos fazer o seu ensaio?"): foto à esquerda,
     painel claro à direita com título alinhado à esquerda, pílulas pretas e logo. */
  body { background: var(--papel); color: var(--preto); }
  .recorte { position: absolute; left: 0; top: 0; bottom: 0; width: 540px; overflow: hidden; }
  .recorte .foto { mask-image: linear-gradient(to bottom, transparent 0, #000 10%); }
  .painel { position: absolute; left: 540px; right: 0; top: 0; bottom: 0; }
  .conteudo { position: absolute; left: 52px; right: 40px; display: flex; flex-direction: column; align-items: flex-start; }
  .conteudo .espacado { color: var(--vinho); text-align: left; letter-spacing: .3em; }
  .titulo { font-family: var(--display); font-weight: 400; line-height: 1.02; color: var(--preto); }
  .linha { width: 100%; height: 1px; background: #d2d2d2; }
  .pilula-preta { letter-spacing: .08em; }
  .pct-linha { display: flex; align-items: baseline; gap: 12px; color: var(--preto); }
  .nota { color: #4d4d4d; }
  .logo { position: absolute; left: 50%; transform: translateX(-50%); }
  .condicoes, .inclui { color: #2b2b2b; }
  .pilula-vinho { white-space: normal; line-height: 1.3; }
  .oferta-ouro .pilula-preta { letter-spacing: .32em; }

  /* STORY 1080x1920 — texto entre y=250 e y=1530 */
  .story .etiqueta { --w: 156px; --circ: 262px; right: 34px; }
  .story .conteudo { top: 470px; }
  .story .conteudo .espacado { font-size: 34px; }
  .story .titulo { font-size: 80px; margin-top: 14px; }
  .story .linha { margin: 34px 0 32px; }
  .story .pilula-preta { font-size: 20px; padding: 14px 24px; }
  .story .pct { font-size: 124px; }
  .story .off { font-size: 36px; }
  .story .pct-linha { margin: 4px 0 26px; }
  .story .nota { font-size: 21px; margin-top: 4px; }
  .story .logo { width: 200px; top: 1414px; }
  .story.oferta-ouro .conteudo { top: 440px; }
  .story.oferta-ouro .linha { margin: 30px 0 28px; }
  .story .preco { margin-top: 16px; gap: 10px; }
  .story .preco .px { font-size: 32px; }
  .story .preco .rs { font-size: 34px; }
  .story .preco .valor-grande { font-size: 124px; }
  .story .condicoes { font-size: 22px; margin-top: 10px; line-height: 1.35; }
  .story .inclui { font-size: 21px; margin-top: 10px; line-height: 1.4; }
  .story .pilula-vinho { font-size: 20px; padding: 10px 18px; margin-top: 24px; }
  .story.oferta-ouro .nota { font-size: 20px; margin-top: 16px; }

  /* FEED 4:5 1080x1350 */
  .feed .etiqueta { --w: 120px; --circ: 40px; right: 30px; }
  .feed .conteudo { top: 236px; }
  .feed .conteudo .espacado { font-size: 30px; }
  .feed .titulo { font-size: 68px; margin-top: 12px; }
  .feed .linha { margin: 30px 0 28px; }
  .feed .pilula-preta { font-size: 18px; padding: 12px 22px; }
  .feed .pct { font-size: 112px; }
  .feed .off { font-size: 32px; }
  .feed .pct-linha { margin: 4px 0 22px; }
  .feed .nota { font-size: 18px; margin-top: 4px; }
  .feed .logo { width: 170px; top: 1180px; }
  .feed.oferta-ouro .conteudo { top: 196px; }
  .feed.oferta-ouro .titulo { font-size: 64px; }
  .feed.oferta-ouro .linha { margin: 22px 0 22px; }
  .feed .preco { margin-top: 10px; gap: 8px; }
  .feed .preco .px { font-size: 27px; }
  .feed .preco .rs { font-size: 29px; }
  .feed .preco .valor-grande { font-size: 104px; }
  .feed .condicoes { font-size: 18px; margin-top: 6px; line-height: 1.35; }
  .feed .inclui { font-size: 18px; margin-top: 6px; line-height: 1.4; }
  .feed .pilula-vinho { font-size: 17px; padding: 8px 14px; margin-top: 16px; }
  .feed.oferta-ouro .nota { font-size: 16px; margin-top: 12px; }
</style>
</head>
<body>
  <div class="recorte"><img class="foto" alt=""></div>
  <div class="painel">
    <div class="conteudo"></div>
    <img class="logo" src="../assets/marca/logo-preto.png" alt="Ana Claudia Clicks">
  </div>
  <div class="etiqueta"><img src="../assets/marca/etiqueta-black-friday.png" alt="Black Friday"></div>

  <script type="module">
    import { peca, posiciona, pronto, preco, inclui, CONDICAO, NOTA_DESCONTO, NOTA_OURO, INCLUI } from './base.js';
    const { p, fmt, foto } = peca();
    const img = document.querySelector('.foto');
    img.src = foto; posiciona(img, p.quadro[fmt]);
    // fundo atrás da foto = cor do topo do fundo de estúdio, para o degradê de cima não aparecer
    document.querySelector('.recorte').style.background = p.fundo || '#565656';

    document.querySelector('.conteudo').innerHTML = p.oferta === 'desconto' ? `
      <p class="espacado">Black Friday</p>
      <h1 class="titulo">Condição<br>Especial<br>somente em<br>Novembro</h1>
      <div class="linha"></div>
      <span class="pilula-preta">Ensaio Gestante*</span>
      <div class="pct-linha"><span class="pct">15%</span><span class="off">OFF</span></div>
      <span class="pilula-preta">Combo Gestante + Newborn*</span>
      <div class="pct-linha"><span class="pct">20%</span><span class="off">OFF</span></div>
      <p class="nota">*Válido para reservas realizadas<br>em novembro de 2026.</p>` : `
      <p class="espacado">Black Friday</p>
      <h1 class="titulo">Ensaio<br>Gestante</h1>
      <div class="linha"></div>
      <span class="pilula-preta">Pacote Ouro</span>
      ${preco(p.parcelas).replace('<span class="ponto">·</span> ou', '<br>ou')}
      <p class="inclui">${INCLUI.slice(0, 2).join(' · ')}<br>${INCLUI.slice(2).join(' · ')}</p>
      <span class="pilula-vinho">Condição Especial<br>somente em Novembro</span>
      <p class="nota">${NOTA_OURO}</p>`;
    pronto();
  </script>
</body>
</html>
