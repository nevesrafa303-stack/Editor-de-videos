<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>C1 — Capa (modelo de vermelho)</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Modelo da capa do PDF: título GESTANTE no alto, etiqueta pendurada, oferta sobre a saia. */
  body { background: radial-gradient(120% 70% at 45% 35%, #3a3a38 0%, #2d2d2b 60%, #242423 100%); }
  .foto { mask-image: linear-gradient(to bottom, transparent 0, #000 9%); }
  .sombra { position: absolute; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(24,24,23,0) 0%, rgba(24,24,23,.72) 34%, rgba(20,20,19,.93) 62%, #141413 100%); }

  .topo { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .wordmark { display: block; }
  .topo .espacado { color: var(--marfim); }

  .oferta { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .colunas { display: flex; align-items: stretch; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .col .pct-linha { display: flex; align-items: baseline; gap: 14px; color: var(--marfim); }
  .col .rotulo { font-weight: 600; text-transform: uppercase; letter-spacing: .14em; line-height: 1.3; color: var(--marfim); }
  .divisor { width: 2px; background: rgba(246,243,238,.45); }
  .nota { color: #d9d4cc; }

  /* STORY 1080x1920 — conteúdo entre y=250 e y=1530 */
  .story .foto { width: 1280px; left: -96px; top: -90px; }
  .story .sombra { top: 930px; }
  .story .etiqueta { --w: 168px; --circ: 268px; right: 28px; }
  .story .topo { top: 300px; }
  .story .wordmark { width: 560px; }
  .story .topo .espacado { font-size: 40px; margin-top: 26px; padding-left: .42em; }
  .story .oferta { top: 1104px; }
  .story .col { width: 455px; }
  .story .col .pct { font-size: 144px; }
  .story .col .off { font-size: 40px; }
  .story .col .rotulo { font-size: 25px; margin-top: 10px; }
  .story .divisor { margin: 18px 10px; }
  .story .pilula-vinho { font-size: 25px; padding: 13px 26px; margin-top: 30px; }
  .story .nota { font-size: 21px; margin-top: 16px; }
  .story .logo { width: 140px; margin-top: 20px; }

  /* FEED 4:5 1080x1350 */
  .feed .foto { width: 1104px; left: -22px; top: -236px; }
  .feed .sombra { top: 760px; }
  .feed .etiqueta { --w: 140px; --circ: 54px; right: 40px; }
  .feed .topo { top: 64px; }
  .feed .wordmark { width: 520px; }
  .feed .topo .espacado { font-size: 34px; margin-top: 20px; padding-left: .42em; }
  .feed .oferta { top: 862px; }
  .feed .col { width: 430px; }
  .feed .col .pct { font-size: 124px; }
  .feed .col .off { font-size: 34px; }
  .feed .col .rotulo { font-size: 22px; margin-top: 8px; }
  .feed .divisor { margin: 14px 10px; }
  .feed .pilula-vinho { font-size: 22px; padding: 11px 22px; margin-top: 24px; }
  .feed .nota { font-size: 17px; margin-top: 12px; }
  .feed .logo { width: 120px; margin-top: 16px; }
</style>
</head>
<body>
  <img class="foto" src="../assets/fotos/modelo-vermelho.jpg" alt="">
  <div class="sombra"></div>

  <div class="etiqueta"><img src="../assets/marca/etiqueta-black-friday.png" alt="Black Friday"></div>

  <header class="topo">
    <img class="wordmark" src="../assets/marca/gestante-wordmark.png" alt="Gestante">
    <p class="espacado">Black Friday</p>
  </header>

  <section class="oferta">
    <div class="colunas">
      <div class="col">
        <div class="pct-linha"><span class="pct">15%</span><span class="off">OFF</span></div>
        <p class="rotulo">Ensaio Gestante*</p>
      </div>
      <div class="divisor"></div>
      <div class="col">
        <div class="pct-linha"><span class="pct">20%</span><span class="off">OFF</span></div>
        <p class="rotulo">Combo Gestante<br>+ Newborn*</p>
      </div>
    </div>
    <span class="pilula-vinho">Condição Especial somente em Novembro</span>
    <p class="nota">*Válido para reservas realizadas em novembro de 2026.</p>
    <img class="logo" src="../assets/marca/logo-branco.png" alt="Ana Claudia Clicks">
  </section>

  <script src="base.js"></script>
</body>
</html>
