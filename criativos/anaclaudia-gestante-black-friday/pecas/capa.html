<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Layout capa</title>
<link rel="stylesheet" href="base.css">
<style>
  /* Capa escura (capa do PDF): grafite, etiqueta pendurada, "Ensaio de ..." no alto, foto(s) em arco
     com contorno fino e o desconto junto da foto. Nada é desenhado por cima das fotos.
     Variantes: um-v (gestante: arco à esquerda, oferta à direita), um-h (newborn: foto horizontal, oferta
     embaixo), dois (juntos: cada foto com o seu desconto logo abaixo). */
  body { background: radial-gradient(120% 70% at 50% 35%, #3a3a38 0%, #2e2e2c 60%, #242423 100%); }
  .topo { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .espacado { color: #e6e1d8; }
  .ensaio { font-family: var(--serif-fina); text-transform: uppercase; letter-spacing: .32em; padding-left: .32em; color: #c9c2b6; }
  .titulo { text-transform: uppercase; letter-spacing: .06em; color: var(--marfim); }
  .bloco { position: absolute; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .bloco .pct-linha, .col .pct-linha { color: var(--marfim); }
  .colunas { position: absolute; display: flex; }
  .col { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .pilula-preta { background: var(--marfim); color: var(--preto); }
  .nota { color: #d9d4cc; }
  .caixa { flex-direction: column; border-radius: 30px; width: 100%; }
  .caixa .rotulo, .caixa .valor { width: 100%; }
  .bloco .caixa .pct-linha { color: var(--preto); }
  .pilula-vinho.duas { white-space: normal; line-height: 1.3; }
  /* combo: nome de cada ensaio embaixo da sua foto */
  .nome { font-family: var(--serif-fina); text-transform: uppercase; letter-spacing: .26em; padding-left: .26em; color: #e6e1d8; }

  /* STORY 1080x1920 — texto entre y=250 e y=1530 */
  .story .etiqueta { --w: 160px; --circ: 268px; right: 30px; }
  .story .topo { top: 262px; }
  .story .espacado { font-size: 34px; }
  .story .ensaio { font-size: 30px; margin-top: 16px; }
  .story .wordmark { width: 480px; margin-top: 12px; }
  .story .titulo { font-size: 92px; margin-top: 6px; }
  .story.dois .titulo { font-size: 64px; line-height: 1.08; }
  .story .pilula-vinho { font-size: 24px; padding: 12px 24px; }
  .story .nota { font-size: 21px; }
  /* um-v: coluna à direita do arco */
  .story.um-v .bloco { left: 560px; width: 460px; top: 700px; }
  .story.um-v .caixa .rotulo { height: 78px; font-size: 23px; }
  .story.um-v .caixa .valor { height: 168px; }
  .story.um-v .caixa .pct { font-size: 128px; }
  .story.um-v .caixa .off { font-size: 38px; }
  .story.um-v .pilula-vinho { margin-top: 30px; font-size: 22px; }
  .story.um-v .nota { margin-top: 16px; }
  /* um-h: oferta embaixo da foto */
  .story.um-h .bloco { left: 60px; right: 60px; top: 1090px; }
  .story.um-h .pilula-preta { font-size: 22px; padding: 13px 26px; }
  .story.um-h .pct { font-size: 170px; }
  .story.um-h .off { font-size: 48px; }
  .story.um-h .bloco .pct-linha { margin-top: 10px; }
  .story.um-h .pilula-vinho { margin-top: 18px; }
  .story.um-h .nota { margin-top: 14px; }
  /* dois: desconto embaixo de cada arco */
  .story.dois .colunas { left: 80px; right: 80px; top: 1130px; gap: 40px; }
  .story.dois .col { width: 440px; }
  .story.dois .nome { font-size: 22px; }
  .story.dois .bloco { left: 60px; right: 60px; top: 1190px; }
  .story.dois .pilula-preta { font-size: 21px; padding: 12px 26px; }
  .story.dois .bloco .pct { font-size: 150px; }
  .story.dois .bloco .off { font-size: 44px; }
  .story.dois .bloco .pct-linha { margin-top: 8px; }
  .story.dois .pilula-vinho { margin-top: 18px; }
  .story.dois .nota { margin-top: 14px; }

  /* FEED 4:5 1080x1350 */
  .feed .etiqueta { --w: 120px; --circ: 40px; right: 30px; }
  .feed .topo { top: 46px; }
  .feed .espacado { font-size: 28px; }
  .feed .ensaio { font-size: 24px; margin-top: 10px; }
  .feed .wordmark { width: 400px; margin-top: 10px; }
  .feed .titulo { font-size: 70px; margin-top: 4px; }
  .feed.dois .titulo { font-size: 50px; }
  .feed .pilula-vinho { font-size: 20px; padding: 10px 20px; }
  .feed .nota { font-size: 17px; }
  .feed.um-v .bloco { left: 570px; width: 450px; top: 440px; }
  .feed.um-v .caixa .rotulo { height: 70px; font-size: 21px; }
  .feed.um-v .caixa .valor { height: 150px; }
  .feed.um-v .caixa .pct { font-size: 112px; }
  .feed.um-v .caixa .off { font-size: 34px; }
  .feed.um-v .pilula-vinho { margin-top: 26px; }
  .feed.um-v .nota { margin-top: 14px; }
  .feed.um-h .bloco { left: 60px; right: 60px; top: 772px; }
  .feed.um-h .pilula-preta { font-size: 19px; padding: 11px 22px; }
  .feed.um-h .pct { font-size: 132px; }
  .feed.um-h .off { font-size: 38px; }
  .feed.um-h .bloco .pct-linha { margin-top: 6px; }
  .feed.um-h .pilula-vinho { margin-top: 14px; }
  .feed.um-h .nota { margin-top: 12px; }
  .feed.dois .colunas { left: 80px; right: 80px; top: 736px; gap: 40px; }
  .feed.dois .col { width: 440px; }
  .feed.dois .nome { font-size: 18px; }
  .feed.dois .bloco { left: 60px; right: 60px; top: 780px; }
  .feed.dois .pilula-preta { font-size: 18px; padding: 10px 22px; }
  .feed.dois .bloco .pct { font-size: 116px; }
  .feed.dois .bloco .off { font-size: 34px; }
  .feed.dois .bloco .pct-linha { margin-top: 6px; }
  .feed.dois .pilula-vinho { margin-top: 14px; }
  .feed.dois .nota { margin-top: 12px; }
</style>
</head>
<body>
  <div class="etiqueta"><img src="../assets/marca/etiqueta-black-friday.png" alt="Black Friday"></div>
  <header class="topo"></header>
  <div class="colunas"></div>
  <section class="bloco"></section>

  <script type="module">
    import { peca, montarQuadros, pronto, OFERTAS, pctHTML, CONDICAO, NOTA } from './base.js';
    const { p, fmt } = peca();
    const topo = {
      gestante: '<p class="ensaio">Ensaio de</p><img class="wordmark" src="../assets/marca/gestante-wordmark.png" alt="Gestante">',
      newborn: '<p class="ensaio">Ensaio de</p><h1 class="titulo">Newborn</h1>',
      juntos: `<p class="ensaio">Combo</p><h1 class="titulo">Gestante${fmt === 'story' ? '<br>' : ' '}+ Newborn</h1>`,
    }[p.grupo];
    document.querySelector('.topo').innerHTML = `<p class="espacado">Black Friday</p>${topo}`;
    const fim = (duas = false) => `<span class="pilula-vinho${duas ? ' duas' : ''}">${CONDICAO}</span><p class="nota">${NOTA}</p>`;
    const bloco = document.querySelector('.bloco'), colunas = document.querySelector('.colunas');
    if (p.variante === 'um-v') {
      const o = OFERTAS.gestante;
      bloco.innerHTML = `<div class="caixa"><div class="rotulo">${o.rotulo}</div><div class="valor">${pctHTML(o)}</div></div>${fim(true)}`;
    } else if (p.variante === 'um-h') {
      const o = OFERTAS.newborn;
      bloco.innerHTML = `<span class="pilula-preta">${o.rotulo}</span>${pctHTML(o)}${fim()}`;
    } else {
      // combo: uma oferta só (20%) para as duas fotos; embaixo de cada foto, o nome do ensaio
      colunas.innerHTML = ['Ensaio de Gestante', 'Ensaio de Newborn'].map(n => `<div class="col"><p class="nome">${n}</p></div>`).join('');
      const o = OFERTAS.combo;
      bloco.innerHTML = `<span class="pilula-preta">${o.rotulo}</span>${pctHTML(o)}${fim()}`;
    }
    await montarQuadros(p.quadros[fmt]);
    pronto();
  </script>
</body>
</html>
