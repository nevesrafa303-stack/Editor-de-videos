<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ensaio de Natal 2026 · peça</title>
<link rel="stylesheet" href="base.css">
</head>
<body>
  <script type="module">
    // Monta a peça ?p=<id> no formato #story ou #feed a partir de dados.js e avisa o render (window.__ready).
    // Conteúdo fixo do projeto (sem entrada externa).
    import { PECAS, TAMANHOS, SELO } from './dados.js';

    const fmt = location.hash.slice(1) || 'story';
    const id = new URLSearchParams(location.search).get('p');
    const p = PECAS.find(x => x.id === id) || PECAS[0];
    const L = p[fmt], T = TAMANHOS[fmt];
    document.body.classList.add(fmt);

    // fotos: só corte e redução (nunca amplia)
    window.__escalas = [];
    const X = 2; // fator de exportação
    for (const q of L.paineis) {
      const m = document.createElement('div');
      m.className = 'painel';
      Object.assign(m.style, { left: `${q.x}px`, top: `${q.y}px`, width: `${q.w}px`, height: `${q.h}px` });
      const img = new Image(); img.alt = ''; img.src = `../assets/fotos/${q.foto}.jpg`;
      m.appendChild(img); document.body.appendChild(m);
      await img.decode();
      const nw = img.naturalWidth, nh = img.naturalHeight;
      const escala = Math.max(q.w * X / nw, q.h * X / nh) * (q.z ?? 1);  // menor escala que cobre a janela (z: aproximar)
      const w = nw * escala / X, h = nh * escala / X;
      const left = Math.min(0, Math.max(q.w - w, q.w / 2 - (q.fx ?? .5) * w));
      const top = Math.min(0, Math.max(q.h - h, q.h / 2 - (q.fy ?? .5) * h));
      Object.assign(img.style, { width: `${w}px`, height: `${h}px`, left: `${left}px`, top: `${top}px` });
      // quanto da foto aparece (para conferir que o cenário não foi cortado demais)
      window.__escalas.push({ foto: q.foto, escala: +escala.toFixed(3), mostra: [+(q.w / w).toFixed(2), +(q.h / h).toFixed(2)] });
    }

    // faixa dourada "Ensaio de Natal 2026" (em destaque, pedido de 09/11/2026)
    if (L.faixa) {
      const f = L.faixa, el = document.createElement('div');
      el.className = 'faixa';
      Object.assign(el.style, { left: `${f.x ?? 0}px`, width: `${f.w ?? 1080}px`, top: `${f.top}px` });
      el.innerHTML = `<p style="font-size:${f.fs ?? T.faixa}px"><span>${SELO}</span></p>`;
      document.body.appendChild(el);
    }

    // textos (por cima do cenário, nunca das pessoas)
    for (const b of L.textos) {
      const el = document.createElement('div');
      el.className = `bloco ${b.tom}`;
      Object.assign(el.style, { left: `${b.x}px`, width: `${b.w}px`, top: `${b.top}px` });
      for (const [tipo, texto = '', o = {}] of b.itens) {
        const t = document.createElement('template');
        t.innerHTML = `<p class="${tipo}">${texto}</p>`;
        const n = t.content.firstElementChild;
        n.style.fontSize = `${o.fs ?? T[tipo]}px`;
        if (o.mt !== undefined) n.style.marginTop = `${o.mt}px`;
        el.appendChild(n);
      }
      document.body.appendChild(el);
    }

    await Promise.all(['400 40px "Great Vibes"', '700 20px Cinzel'].map(f => document.fonts.load(f)));
    await document.fonts.ready;
    window.__ready = true;
  </script>
</body>
</html>
