<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>B4 · Bradesco · Hospital Samaritano</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="hosp.css">
<style>
  /* B4 — fachada real do Hospital Samaritano (Higienópolis), com a placa do hospital à vista, num quadro grande;
     o cartão branco com o preço da cotação entra por cima da base da foto. */
  body { background: radial-gradient(120% 70% at 50% 20%, #e3163f 0%, #c0072b 38%, #8f001b 72%, #5c0016 100%); }
  .logo { position: absolute; left: 395px; top: 296px; width: 290px; color: #fff; }
  .chip { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; top: 410px; height: 46px; padding: 0 24px;
    font-size: 19px; color: #fff; background: rgba(60,0,14,.35); border: 1px solid rgba(255,255,255,.45); }
  .h1 { position: absolute; left: 0; right: 0; top: 484px; text-align: center; font-family: var(--mont); font-weight: 900; font-size: 56px;
    line-height: 1.12; letter-spacing: -.015em; }
  .h1 em { font-style: normal; background: #fff; color: var(--brad); padding: 0 14px; border-radius: 10px; }

  .quadro.grande { left: 60px; top: 640px; width: 960px; height: 560px; }
  .quadro.grande img { left: 0; top: 0; width: 952px; height: 552px; }
  .quadro.grande .credito { right: 14px; top: 14px; }
  .placa { left: 86px; top: 660px; }
  .placa .sinal { background: var(--brad); color: #fff; }
  .placa .nome { color: var(--brad-esc); }
  .placa .bairro { color: #6b3a44; }

  .cartao { position: absolute; left: 120px; right: 120px; top: 1010px; height: 206px; border-radius: 26px; background: #fff;
    box-shadow: 0 26px 50px rgba(30,0,6,.45); color: #2b0a10; }
  .cartao .faixa { position: absolute; left: 0; right: 0; top: 0; height: 52px; border-radius: 26px 26px 0 0; background: var(--brad);
    display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; font-weight: 700; font-size: 20px;
    letter-spacing: .1em; text-transform: uppercase; }
  .cartao .faixa .icone { width: 24px; height: 24px; }
  .cartao .preco { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 80px; color: var(--brad); }
  .cartao .preco .mes { font-family: 'Poppins'; font-weight: 600; font-size: 26px; letter-spacing: 0; margin-left: 6px; color: #5a3a40; }
  .cartao .nota-preco { position: absolute; left: 0; right: 0; top: 164px; text-align: center; color: #5a3a40; }
  .cta { background: #fff; color: var(--brad-esc); box-shadow: 0 14px 30px rgba(40,0,8,.35); }
  .cta .icone { color: var(--brad); }
  .legal { color: rgba(255,255,255,.88); }
</style>
</head>
<body data-operadora="bradesco" data-hospital="sim">
  <div class="logo" data-marca="bradesco"></div>
  <p class="chip"><span class="req"><span data-icone="maleta"></span>Exclusivo para CNPJ/MEI</span>A partir de 3 vidas · São Paulo (SP)</p>
  <h1 class="h1">Hospital Samaritano na rede,<br><em>em enfermaria</em></h1>

  <div class="quadro grande">
    <img src="../assets/fotos/cortes/h-samaritano.jpg" alt="">
    <p class="credito">Foto: Hsama · CC BY 3.0</p>
  </div>
  <div class="placa"><span class="sinal"><span data-icone="hospital"></span></span><div><p class="nome">Hospital Samaritano</p><p class="bairro">Higienópolis · São Paulo</p></div></div>

  <div class="cartao">
    <p class="faixa"><span data-icone="check"></span>Efetivo Plus · 3 vidas · sem coparticipação</p>
    <p class="preco"><span class="rs">R$</span>2.362<span class="cent">,01*</span><span class="mes">/mês</span></p>
    <p class="nota-preco"></p>
  </div>

  <div class="cta"><span data-icone="formulario"></span>Solicite sua cotação</div>
  <p class="legal"></p>

  <script type="module">
    import { montar } from './base.js';
    await montar();
  </script>
</body>
</html>
