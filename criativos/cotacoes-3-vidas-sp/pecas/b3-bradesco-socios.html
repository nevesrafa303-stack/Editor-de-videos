<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>B3 · Bradesco · Sócios com forma curva</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="ref.css">
<link rel="stylesheet" href="v3.css">
<style>
  /* B3 — referência 07: foto real dos sócios (Adobe Stock) em tela cheia e uma forma curva vinho por cima com a oferta
     para sócios e diretores e a rede (São Camilo, BP, Samaritano). */
  body { background: #670000; color: #fff; }
  .foto.hero { left: 0; top: 0; width: 1080px; height: 1232px; }
  .veu.topo { top: 0; height: 720px; background: linear-gradient(180deg, rgba(40,0,0,.88) 0%, rgba(40,0,0,.7) 55%, rgba(40,0,0,0) 100%); }
  .forma { position: absolute; left: 0; top: 700px; width: 1080px; height: 534px; }
  .logo { position: absolute; left: 60px; top: 296px; width: 250px; color: #fff; }
  .ps { background: #fff; color: #670000; }
  .cnpj { background: #e3163f; color: #fff; }
  .vidas3 { left: 640px; top: 524px; padding: 8px 16px; border-radius: 10px; background: rgba(40,0,0,.78); color: #fff; }

  .para { position: absolute; left: 60px; top: 812px; font-weight: 700; font-style: italic; font-size: 36px; }
  .oferta { position: absolute; left: 60px; top: 872px; }
  .oferta .rot3 { color: #ffd2d8; }
  .oferta .preco { margin-top: 2px; font-size: 84px; }
  .nota-preco { position: absolute; left: 60px; top: 972px; color: rgba(255,255,255,.88); }
  .rot-rede { position: absolute; left: 60px; top: 1024px; font-weight: 600; font-size: 20px; color: #ffd2d8; }
  .rede { position: absolute; left: 60px; top: 1054px; font-family: var(--mont); font-weight: 900; font-size: 34px; }
  .rede i { display: inline-block; width: 3px; height: 30px; background: #e3163f; margin: 0 16px; vertical-align: -3px; }
  .selo.copart { left: 60px; top: 1120px; background: #fff; color: #670000; }
  .legal { color: rgba(255,255,255,.88); }
  .faixa { background: #e3163f; color: #fff; }
</style>
</head>
<body data-operadora="bradesco" data-hospital="sim">
  <img class="foto hero" src="../assets/fotos/cortes/v3-b3-socios.jpg" alt="">
  <div class="veu topo"></div>
  <svg class="forma" viewBox="0 0 1080 534" preserveAspectRatio="none">
    <path d="M0 70C260 30 560 60 700 200C780 280 820 400 860 534H0Z" fill="#670000" fill-opacity=".96"/>
    <path d="M0 70C260 30 560 60 700 200C780 280 820 400 860 534" fill="none" stroke="#e3163f" stroke-width="6"/>
  </svg>

  <div class="logo" data-marca="bradesco"></div>
  <p class="ps">Planos de Saúde</p>
  <p class="cnpj"><span data-icone="maleta"></span>Exclusivo para CNPJ/MEI</p>
  <p class="vidas3">a partir de 3 vidas</p>

  <p class="para">para sócios e diretores</p>
  <div class="oferta">
    <p class="rot3">3 vidas · a partir de</p>
    <p class="preco"><span class="rs">R$</span>2.362<span class="cent">,01*</span><span class="mes">/mês</span></p>
  </div>
  <p class="nota-preco"></p>
  <p class="rot-rede">Na rede, em enfermaria:</p>
  <p class="rede">São Camilo<i></i>BP<i></i>Samaritano</p>
  <p class="selo copart">Sem coparticipação</p>

  <p class="legal"></p>
  <div class="faixa"><p class="txt">Solicite sua cotação<span data-icone="seta"></span></p></div>

  <script type="module">
    import { montar } from './base.js';
    await montar();
  </script>
</body>
</html>
