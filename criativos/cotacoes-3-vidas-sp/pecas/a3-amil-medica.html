<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>A3 · Amil · 50% OFF e médica</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="ref.css">
<link rel="stylesheet" href="v3.css">
<style>
  /* A3 — referências 05 e 08 com movimento: a médica real (Adobe Stock, recortada) sai de um círculo amarelo, "50% OFF"
     gigante à esquerda e o preço da 1ª e da 2ª mensalidade. */
  body { background: radial-gradient(110% 70% at 80% 55%, #5b34ff 0%, #4318fc 40%, #2a10b8 75%, #170b66 100%); color: #fff; }
  .logo { position: absolute; left: 60px; top: 300px; width: 220px; color: #fff; }
  .ps { background: #fff; color: #4318fc; }
  .cnpj { background: #ffc542; color: #0f0d59; }
  .vidas3 { left: 652px; color: #fff; }

  .circulo { position: absolute; left: 560px; top: 760px; width: 480px; height: 480px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffd76e 0%, #ffc542 55%, #f0a91c 100%); }
  .recorte { position: absolute; left: 540px; top: 600px; width: 540px; height: 626px; overflow: hidden; }
  .recorte img { position: absolute; left: 50px; top: 0; width: 451px; height: 760px; }

  .off { position: absolute; left: 56px; top: 618px; font-family: var(--mont); font-weight: 900; font-size: 150px; line-height: .9;
    letter-spacing: -.04em; color: #ffc542; }
  .off-sub { position: absolute; left: 62px; top: 768px; font-family: var(--mont); font-weight: 800; font-size: 32px; line-height: 1.1; }
  .oferta { position: absolute; left: 60px; top: 870px; }
  .oferta .rot3 { color: #d9d4ff; font-size: 20px; }
  .oferta .preco { margin-top: 4px; font-size: 92px; }
  .depois { position: absolute; left: 62px; top: 984px; font-weight: 500; font-size: 22px; color: #e4e0ff; }
  .depois b { color: #fff; font-weight: 700; }
  .nota-preco { position: absolute; left: 62px; top: 1022px; color: rgba(255,255,255,.85); }
  .info { position: absolute; left: 60px; top: 1078px; display: flex; flex-direction: column; gap: 10px; }
  .info p { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 22px; }
  .info p i { width: 14px; height: 14px; border-radius: 3px; background: #ffc542; flex: none; }
  .legal { color: rgba(255,255,255,.88); }
  .faixa { background: #ffc542; color: #0f0d59; }
</style>
</head>
<body data-operadora="amil" data-foto="sim">
  <div class="logo" data-marca="amil"></div>
  <p class="ps">Planos de Saúde</p>
  <p class="cnpj"><span data-icone="maleta"></span>Exclusivo para CNPJ/MEI</p>
  <p class="vidas3">a partir de 3 vidas</p>

  <div class="circulo"></div>
  <div class="recorte"><img src="../assets/fotos/cortes/v2-a3-medica.png" alt=""></div>

  <p class="off">50% OFF</p>
  <p class="off-sub">na 1ª e na 2ª mensalidade</p>
  <div class="oferta">
    <p class="rot3">3 vidas · 1ª e 2ª por</p>
    <p class="preco"><span class="rs">R$</span>723<span class="cent">,00*</span></p>
  </div>
  <p class="depois">depois, <b>R$ 1.445,99</b> por mês</p>
  <p class="nota-preco"></p>
  <div class="info">
    <p><i></i>Amil Prata nacional · enfermaria</p>
    <p><i></i>Coparticipação só em terapias</p>
  </div>

  <p class="legal"></p>
  <div class="faixa"><p class="txt">Solicite sua cotação<span data-icone="seta"></span></p></div>

  <script type="module">
    import { montar } from './base.js';
    await montar();
  </script>
</body>
</html>
