<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>V2 · Vila Nova Star · estilo da referência 14</title>
<link rel="stylesheet" href="base.css">
<style>
  /* V2 — referência 14 (SulAmérica, "plano de saúde com CNPJ"): fundo claro, arco laranja no topo com "PLANOS DE
     SAÚDE", título em azul-marinho com o hospital em destaque, "A PARTIR DE" espaçado + "3 VIDAS" gigante em laranja,
     tarja vermelha "EXCLUSIVO PARA CNPJ/MEI", caixa laranja de diferenciais e o letreiro real do hospital em cartão
     (quadro do vídeo do banco). */
  body { background: #eef0f3; color: #0b2354; }
  body.story { background: #eef0f3; }
  .arco { left: -310px; top: -1250px; width: 1700px; height: 1430px; border-radius: 50%; background: #e05a1b; }
  .ps { left: 0; right: 0; top: 52px; text-align: center; font-family: var(--mont); font-weight: 900; font-size: 64px; line-height: 1;
    letter-spacing: -.01em; text-transform: uppercase; color: #fff; text-shadow: 0 3px 0 rgba(140,50,0,.35); }
  .ps small { display: block; font-size: 25px; letter-spacing: .14em; margin-top: 8px; }

  .tit { left: 0; right: 0; top: 170px; text-align: center; font-family: var(--mont); font-weight: 900; font-size: 54px; line-height: 1.04;
    text-transform: uppercase; letter-spacing: -.01em; }
  .tit .mk { background: #0b2354; color: #fff; }
  .sub { left: 0; right: 0; top: 290px; text-align: center; font-weight: 500; font-size: 27px; line-height: 1.25; color: #26305a; }

  .oferta { left: 60px; top: 342px; width: 480px; }
  .oferta .rot { font-family: var(--mont); font-weight: 800; font-size: 28px; letter-spacing: .16em; text-transform: uppercase; }
  .oferta .v3x { font-family: var(--mont); font-weight: 900; font-size: 96px; line-height: .95; letter-spacing: -.03em; color: #e0521b;
    text-transform: uppercase; white-space: nowrap; margin-top: 4px; }
  .oferta .tarja { display: inline-flex; align-items: center; gap: 10px; margin-top: 12px; padding: 9px 18px; border-radius: 10px;
    background: #b8320f; color: #fff; font-family: var(--mont); font-weight: 900; font-size: 24px; white-space: nowrap; }
  .oferta .tarja .icone { width: 26px; height: 26px; }

  .dif { left: 560px; top: 340px; width: 460px; padding: 22px 26px 24px; border-radius: 22px; background: #f6751b; color: #fff;
    box-shadow: 0 16px 34px rgba(224,82,27,.3); }
  .dif h3 { font-weight: 700; font-size: 27px; line-height: 1.15; color: #0b2354; }
  .dif ul { list-style: none; margin-top: 10px; }
  .dif li { position: relative; padding-left: 22px; font-weight: 600; font-size: 24px; line-height: 1.3; color: #0b2354; }
  .dif li::before { content: ''; position: absolute; left: 2px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: #0b2354; }

  .cartao-foto { left: 160px; top: 538px; width: 760px; height: 280px; border-radius: 34px; box-shadow: 0 18px 40px rgba(11,35,84,.25); }
  .cartao-foto img { object-position: 50% 63%; }
  .legal { color: #26305a; }
  .faixa { background: #0b2354; }
  .faixa .txt { color: #fff; text-transform: none; font-weight: 800; font-size: 38px; letter-spacing: 0; }
</style>
</head>
<body data-hosp="vns">
  <div class="sq">
    <div class="arco"></div>
    <p class="ps">Planos de Saúde<small>empresariais</small></p>

    <p class="tit">O <span class="mk">Vila Nova Star</span><br>no seu plano</p>
    <p class="sub">Hospital da Rede D'Or na capital de São Paulo</p>

    <div class="oferta">
      <p class="rot">A partir de</p>
      <p class="v3x">3 vidas</p>
      <p class="tarja"><span data-icone="maleta"></span>Exclusivo para CNPJ/MEI</p>
    </div>

    <div class="dif">
      <h3>Diferenciais do hospital</h3>
      <ul>
        <li>Pronto-socorro em suítes</li>
        <li>Concierge e cardápio de chef</li>
        <li>UTI com acompanhante</li>
      </ul>
    </div>

    <div class="cartao-foto"><img src="../assets/fotos/vns-letreiro.jpg" alt=""></div>

    <p class="legal"></p>
    <div class="faixa"><p class="txt">Solicite sua cotação!</p></div>
  </div>

  <script type="module">
    import { montar } from './base.js';
    await montar();
  </script>
</body>
</html>
