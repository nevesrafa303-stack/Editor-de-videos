<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@500&display=block" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#050505;color:#fff;font-family:"Plus Jakarta Sans",sans-serif;position:relative;overflow:hidden}
  .bg{position:absolute;right:-300px;top:0;height:630px;width:auto}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,#050505 40%,rgba(5,5,5,.7) 55%,rgba(5,5,5,0) 70%),linear-gradient(0deg,#050505 0%,rgba(5,5,5,0) 30%)}
  .c{position:absolute;left:72px;top:64px;bottom:64px;width:600px;display:flex;flex-direction:column;justify-content:space-between}
  h1{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:54px;line-height:.98;text-transform:uppercase;letter-spacing:-.01em}
  h1 span{background:linear-gradient(100deg,#FF8A45,#F7BE56 50%,#FF8A45);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{font-size:23px;color:#bdb8b3;margin-top:22px;max-width:520px;line-height:1.35}
  .tag{display:inline-flex;gap:10px;align-items:center;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:#edebe8;font-weight:500}
  .tag i{width:8px;height:8px;border-radius:50%;background:#F7BE56;box-shadow:0 0 14px 3px #FF8A45}

<img class="bg" src="../../rise/src/assets/img/hermano-hero-desktop.webp" alt="">

<div class="c">

  </div>
  <div class="tag"><i></i>Aplicar para uma vaga · Mentoria RISE</div>
</div>
