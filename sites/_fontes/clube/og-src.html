<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Plus+Jakarta+Sans:wght@500;600&display=block" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#050505;color:#fff;font-family:"Plus Jakarta Sans",sans-serif;position:relative;overflow:hidden}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:80% 30%}
  .fade{position:absolute;inset:0;background:linear-gradient(90deg,#050505 30%,rgba(5,5,5,.7) 52%,rgba(5,5,5,.1) 100%),linear-gradient(0deg,#050505 0%,rgba(5,5,5,0) 40%)}
  .c{position:absolute;left:72px;top:60px;bottom:60px;width:640px;display:flex;flex-direction:column;justify-content:space-between}
  h1{font-family:Archivo;font-stretch:125%;font-weight:800;font-size:46px;line-height:1;text-transform:uppercase;letter-spacing:-.01em}
  h1 span{background:linear-gradient(180deg,#E1AD51,#E79848);-webkit-background-clip:text;background-clip:text;color:transparent}
  .meta{display:flex;gap:26px;margin-top:22px;font-size:21px;font-weight:600;color:#edebe8}
  .meta b{color:#E1AD51;font-weight:600}
  .tag{display:inline-flex;gap:10px;align-items:center;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:#edebe8;font-weight:500}
  .tag i{width:8px;height:8px;border-radius:50%;background:#E1AD51;box-shadow:0 0 14px 3px #E79848}
</style></head><body>
<img class="bg" src="../../clube/src/assets/img/palco-placas.webp" alt="">
<div class="fade"></div>
<div class="c">
  <img src="logo-cda.svg" width="238" height="70" alt="">
  <div>
    <h1>Domine os 5 pilares de uma agência de <span>R$ 15 milhões</span></h1>
    <div class="meta"><span><b>25 e 26 set</b> · 2026</span><span>Balneário Camboriú–SC</span></div>
  </div>
  <div class="tag"><i></i>Imersão presencial · Garanta seu ingresso</div>
</div>
</body></html>
